name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install dependencies
        run: python -m pip install --requirement requirements-lock.txt

      - name: Run unit and bundled-result regression tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          MPLCONFIGDIR: /tmp/ptm45-matplotlib-cache
        run: python -m unittest discover -s tests -v

      - name: Recreate SS sensitivity source tables
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          MPLCONFIGDIR: /tmp/ptm45-matplotlib-cache
        run: |
          python ss_sensitivity.py
          git diff --exit-code -- results/validation/*.csv

      - name: Verify release manifest and semantic metrics
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          MPLCONFIGDIR: /tmp/ptm45-matplotlib-cache
        run: python verify_release.py
